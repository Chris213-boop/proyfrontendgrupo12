<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" routerLink="/">
      <i class="bi bi-gem me-2"></i>Lumière
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
      aria-controls="navbarMenu" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 text-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto" routerLinkActive="active">Contacto</a>
        </li>
        <div>
          @if (!loginApi.userLoggedIn()) {
          <a [routerLink]="['login']">(Login)</a>
          } @else {
          <a [routerLink]="['login']" (click)="logout()">
            {{ loginApi.userLogged() }} (logout)
          </a>
          }
        </div>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a class="btn btn-outline-light position-relative" routerLink="/carrito">
            <i class="bi bi-cart3"></i>
            <span *ngIf="cantidadCarrito > 0"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
              {{ cantidadCarrito }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
