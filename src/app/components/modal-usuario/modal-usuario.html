<div class="modal fade" id="modalUsuario" tabindex="-1">

    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    <i class="bi bi-person-plus-fill me-2"></i>
                    Nuevo Usuario
                </h4>
                <button class="btn-close" data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <div *ngIf="mensaje" class="alert alert-{{ tipoMensaje }} mb-3">
                    {{ mensaje }}
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Nombre
                        </label>
                        <input type="text" class="form-control" [(ngModel)]="usuario.nombres">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Apellido
                        </label>
                        <input type="text" class="form-control" [(ngModel)]="usuario.apellido">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Usuario
                        </label>
                        <input type="text" class="form-control" [(ngModel)]="usuario.username">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Contraseña
                        </label>
                        <input type="password" class="form-control" [(ngModel)]="usuario.password">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            Rol
                        </label>
                        <select class="form-select" [(ngModel)]="usuario.perfil">
                            <option value="">Seleccionar rol</option>
                            <option>Administrador</option>
                            <option>Gerente</option>
                            <option>Cliente</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button class="btn btn-warning" [disabled]="guardando" (click)="guardarUsuario()">
                    <span *ngIf="guardando" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    <i *ngIf="!guardando" class="bi bi-floppy-fill me-2"></i>
                    Guardar Usuario
                </button>
            </div>
        </div>
    </div>
</div>
