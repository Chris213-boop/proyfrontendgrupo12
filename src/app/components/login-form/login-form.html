<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2 class="text-center">
                <i class="bi bi-gem me-2"></i>Iniciar Sesión
            </h2>
        </div>
        <form name="form" class="login-form">
            <div class="form-group mb-4">
                <label for="username" class="form-label fw-bold">
                    <i class="bi bi-person me-2"></i>Usuario
                </label>
                <input type="text" class="form-control" id="username" name="username" [(ngModel)]="userform.username"
                    placeholder="Ingrese su usuario" required />
            </div>
            <div class="form-group mb-4">
                <label for="password" class="form-label fw-bold">
                    <i class="bi bi-lock me-2"></i>Contraseña
                </label>
                <input type="password" class="form-control" id="password" name="password"
                    [(ngModel)]="userform.password" placeholder="Ingrese su contraseña" required />
            </div>
            <div *ngIf="msglogin" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <strong>Error:</strong> {{ msglogin }}
                <button type="button" class="btn-close" (click)="msglogin = ''" aria-label="Close"></button>
            </div>
            <button type="button" class="btn btn-login w-100 fw-bold py-2 mb-3" (click)="login()">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>
        <div class="login-footer text-center text-secondary small">
            <p>¿No tienes cuenta? <a routerLink="/register" class="text-decoration-none">Regístrate aquí</a></p>
        </div>
    </div>
</div>
